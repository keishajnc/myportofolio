{% extends "base.html" %}

{% block meta %}
<title>Add Experience - {{ name }}</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="experience-section" id="add-experience">
        <div class="container">
            <p class="section-kicker">Tambah Data</p>
            <h1>Add New Experience</h1>

            <form method="post" action="{% url 'main:create_experience' %}" class="project-form">
                {% csrf_token %}
                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                    <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
                {% endfor %}
                <div style="margin-top: 1rem;">
                    <button type="submit" class="button">Tambah Experience</button>
                    <a href="{% url 'main:show_experience' %}" class="button button-secondary">Batal</a>
                </div>
            </form>
        </div>
    </section>
</main>
{% endblock content %}
