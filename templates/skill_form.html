{% extends "base.html" %}

{% block meta %}
    <title>Add Skill - {{ name }}</title>
{% endblock meta %}

{% block content %}
    <main>
        <section class="skills" id="add-skill">
            <div class="container">
                <p class="section-kicker">Tambah Data</p>
                <h1>Add New Skill</h1>

                <form method="post" action="{% url 'main:create_skill' %}" class="project-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <div style="margin-top: 1rem;">
                        <button type="submit" class="button">Tambah Skill</button>
                        <a href="{% url 'main:show_skill' %}" class="button button-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
